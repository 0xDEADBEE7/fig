[package]
name = "fig"
version = "0.1.0"
edition = "2024"
description = "Render JSON figures as terminal-friendly text"
license = "MIT"

[lib]
name = "fig"

[[bin]]
name = "fig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
